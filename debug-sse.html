<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSE 连接调试工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      color: #4ec9b0;
      margin-bottom: 10px;
    }
    .section {
      background: #252526;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #3e3e42;
    }
    .section-title {
      color: #569cd6;
      font-size: 18px;
      margin-bottom: 15px;
      border-bottom: 1px solid #3e3e42;
      padding-bottom: 10px;
    }
    .status {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }
    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 10px;
      background: #f48771;
    }
    .status-indicator.connected {
      background: #89d185;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #3e3e42;
    }
    .info-label {
      color: #9cdcfe;
    }
    .info-value {
      color: #ce9178;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    button {
      background: #0e639c;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover {
      background: #1177bb;
    }
    button:disabled {
      background: #3e3e42;
      cursor: not-allowed;
    }
    .log-container {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 4px;
      max-height: 400px;
      overflow-y: auto;
      font-size: 13px;
    }
    .log-entry {
      margin: 5px 0;
      padding: 3px 0;
    }
    .log-time {
      color: #858585;
      margin-right: 10px;
    }
    .log-info { color: #4ec9b0; }
    .log-success { color: #89d185; }
    .log-warning { color: #dcdcaa; }
    .log-error { color: #f48771; }
    .dialog-test {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .dialog-test.show {
      display: flex;
    }
    .dialog-content {
      background: #252526;
      padding: 40px;
      border-radius: 16px;
      max-width: 450px;
      width: 90%;
      text-align: center;
      border: 2px solid #f48771;
    }
    .dialog-icon {
      font-size: 60px;
      margin-bottom: 20px;
    }
    .dialog-title {
      color: #f48771;
      font-size: 24px;
      margin-bottom: 15px;
    }
    .dialog-reason {
      color: #9cdcfe;
      margin-bottom: 25px;
    }
    .countdown-box {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 25px;
    }
    .countdown-number {
      color: white;
      font-size: 56px;
      font-weight: bold;
    }
    .countdown-text {
      color: rgba(255,255,255,0.9);
      font-size: 16px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 SSE 连接调试工具</h1>

    <!-- 状态信息 -->
    <div class="section">
      <div class="section-title">连接状态</div>
      <div class="status">
        <div class="status-indicator" id="status-indicator"></div>
        <span id="status-text">未连接</span>
      </div>
      <div class="info-row">
        <span class="info-label">SSE 连接数:</span>
        <span class="info-value" id="sse-count">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">当前用户 ID:</span>
        <span class="info-value" id="user-id">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">Token:</span>
        <span class="info-value" id="token-value">未加载</span>
      </div>
    </div>

    <!-- 控制按钮 -->
    <div class="section">
      <div class="section-title">操作控制</div>
      <div class="button-group">
        <button onclick="connectSSE()" id="btn-connect">🔌 建立 SSE 连接</button>
        <button onclick="checkUserInfo()" id="btn-check">👤 检查用户信息</button>
        <button onclick="testDialog()" id="btn-test">🎭 测试弹窗</button>
        <button onclick="clearLog()" id="btn-clear">🗑️ 清空日志</button>
      </div>
    </div>

    <!-- 日志 -->
    <div class="section">
      <div class="section-title">运行日志</div>
      <div class="log-container" id="log">
        <div class="log-entry"><span class="log-time">--:--:--</span>等待操作...</div>
      </div>
    </div>
  </div>

  <!-- 踢出测试弹窗 -->
  <div class="dialog-test" id="kickout-dialog">
    <div class="dialog-content">
      <div class="dialog-icon">⚠️</div>
      <div class="dialog-title" id="dialog-message">您已被管理员强制下线</div>
      <div class="dialog-reason" id="dialog-reason">原因：被管理员踢出</div>
      <div class="countdown-box">
        <div class="countdown-number" id="countdown-number">5</div>
        <div class="countdown-text">秒后将退出</div>
      </div>
      <button onclick="hideDialog()">关闭测试</button>
    </div>
  </div>

  <script>
    let eventSource = null

    // 日志函数
    function log(message, type = 'info') {
      const logContainer = document.getElementById('log')
      const time = new Date().toLocaleTimeString()
      const entry = document.createElement('div')
      entry.className = 'log-entry'
      entry.innerHTML = `<span class="log-time">${time}</span><span class="log-${type}">${message}</span>`
      logContainer.appendChild(entry)
      logContainer.scrollTop = logContainer.scrollHeight
    }

    // 清空日志
    function clearLog() {
      document.getElementById('log').innerHTML = '<div class="log-entry"><span class="log-time">--:--:--</span>日志已清空</div>'
    }

    // 更新状态
    function updateStatus(connected, userId = '-', sseCount = '-') {
      const indicator = document.getElementById('status-indicator')
      const statusText = document.getElementById('status-text')

      if (connected) {
        indicator.classList.add('connected')
        statusText.textContent = '已连接'
      } else {
        indicator.classList.remove('connected')
        statusText.textContent = '未连接'
      }

      document.getElementById('user-id').textContent = userId
      document.getElementById('sse-count').textContent = sseCount
    }

    // 检查用户信息
    function checkUserInfo() {
      const token = localStorage.getItem('satoken')
      const userInfo = localStorage.getItem('userInfo')

      log('🔍 检查本地存储...', 'info')
      log(`   Token: ${token ? token.substring(0, 30) + '...' : '❌ 未找到'}`, token ? 'success' : 'error')
      log(`   UserInfo: ${userInfo ? '✅ 已找到' : '❌ 未找到'}`, userInfo ? 'success' : 'error')

      if (userInfo) {
        try {
          const user = JSON.parse(userInfo)
          log(`   用户ID: ${user.id || '未知'}`, 'info')
          log(`   用户名: ${user.username || '未知'}`, 'info')
          updateStatus(false, user.id || '-')
        } catch (e) {
          log(`   解析 UserInfo 失败: ${e.message}`, 'error')
        }
      }

      if (!token) {
        log('⚠️ 未找到 Token，请先登录系统', 'warning')
        alert('请先登录系统！')
      }
    }

    // 建立 SSE 连接
    function connectSSE() {
      const token = localStorage.getItem('satoken')

      if (!token) {
        log('❌ 无法建立连接：未找到 Token', 'error')
        alert('请先登录系统！')
        return
      }

      log('🔌 开始建立 SSE 连接...', 'info')
      document.getElementById('btn-connect').disabled = true
      document.getElementById('token-value').textContent = token.substring(0, 20) + '...'

      // 关闭旧连接
      if (eventSource) {
        eventSource.close()
        log('🔄 关闭旧连接', 'warning')
      }

      eventSource = new EventSource('/api/user/notifications')

      // 连接成功
      eventSource.addEventListener('connected', (event) => {
        log('✅ SSE 连接成功建立', 'success')
        log(`   数据: ${event.data}`, 'info')
        updateStatus(true)
        document.getElementById('btn-connect').textContent = '🔄 重新连接'
        document.getElementById('btn-connect').disabled = false
      })

      // 收到踢出通知
      eventSource.addEventListener('kick_out', (event) => {
        log('⚠️ 收到踢出通知！', 'warning')
        const data = JSON.parse(event.data)
        log(`   消息: ${data.message}`, 'warning')
        log(`   原因: ${data.reason}`, 'warning')
        log(`   倒计时: ${data.countdown} 秒`, 'warning')
        log(`   时间戳: ${new Date(data.timestamp).toLocaleString()}`, 'info')
        showDialog(data)
      })

      // 收到倒计时更新
      eventSource.addEventListener('kick_out_update', (event) => {
        const data = JSON.parse(event.data)
        const urgency = data.countdown <= 3 ? '⚠️ ' : ''
        log(`${urgency}⏱️ 倒计时更新: ${data.countdown} 秒`, data.countdown <= 3 ? 'error' : 'info')
        updateCountdown(data.countdown)
      })

      // 倒计时结束
      eventSource.addEventListener('kick_out_final', (event) => {
        log('👋 倒计时结束，即将退出', 'error')
        log(`   数据: ${event.data}`, 'info')
        hideDialog()
        setTimeout(() => {
          log('🚪 开始退出登录...', 'info')
          logout()
        }, 1000)
      })

      // 普通消息
      eventSource.addEventListener('message', (event) => {
        log(`📨 收到消息: ${event.data}`, 'success')
      })

      // 连接错误
      eventSource.onerror = (error) => {
        log('❌ SSE 连接错误', 'error')
        log(`   ReadyState: ${eventSource.readyState}`, 'error')
        log(`   Error: ${error}`, 'error')

        updateStatus(false)

        if (eventSource.readyState === EventSource.CLOSED) {
          log('🔄 3秒后尝试重连...', 'warning')
          setTimeout(() => {
            if (localStorage.getItem('satoken')) {
              connectSSE()
            }
          }, 3000)
        } else if (eventSource.readyState === EventSource.CONNECTING) {
          log('⏳ 正在尝试重新连接...', 'warning')
        }
      }

      // 连接打开
      eventSource.onopen = () => {
        log('🔗 SSE 连接已打开', 'success')
      }
    }

    // 显示弹窗
    function showDialog(data) {
      document.getElementById('dialog-message').textContent = data.message
      document.getElementById('dialog-reason').textContent = `原因：${data.reason}`
      document.getElementById('countdown-number').textContent = data.countdown
      document.getElementById('kickout-dialog').classList.add('show')
    }

    // 更新倒计时
    function updateCountdown(countdown) {
      const numberEl = document.getElementById('countdown-number')
      numberEl.textContent = countdown

      if (countdown <= 3) {
        numberEl.style.color = '#ff0000'
        numberEl.style.transform = 'scale(1.2)'
      }
    }

    // 隐藏弹窗
    function hideDialog() {
      document.getElementById('kickout-dialog').classList.remove('show')
    }

    // 测试弹窗
    function testDialog() {
      log('🎭 显示测试弹窗', 'info')
      showDialog({
        message: '您已被管理员强制下线',
        reason: '测试踢出功能',
        countdown: 5
      })

      // 模拟倒计时
      let count = 5
      const interval = setInterval(() => {
        count--
        if (count > 0) {
          updateCountdown(count)
          log(`⏱️ 测试倒计时: ${count} 秒`, 'info')
        } else {
          clearInterval(interval)
          log('✅ 测试完成', 'success')
          setTimeout(() => hideDialog(), 1000)
        }
      }, 1000)
    }

    // 退出登录
    function logout() {
      log('🚪 开始退出登录...', 'info')

      if (eventSource) {
        eventSource.close()
        eventSource = null
      }

      localStorage.clear()
      log('✅ 已清除所有本地数据', 'success')

      setTimeout(() => {
        log('🔀 跳转到登录页...', 'info')
        window.location.href = '/login'
      }, 1000)
    }

    // 页面加载时自动检查
    window.onload = () => {
      log('🚀 页面加载完成', 'success')
      log('📝 点击"检查用户信息"查看当前状态', 'info')
      log('📝 点击"建立 SSE 连接"开始监听通知', 'info')

      const token = localStorage.getItem('satoken')
      if (token) {
        log('✅ 检测到 Token', 'success')
        checkUserInfo()
      } else {
        log('⚠️ 未检测到 Token，请先登录', 'warning')
      }
    }

    // 页面卸载时关闭连接
    window.onbeforeunload = () => {
      if (eventSource) {
        eventSource.close()
      }
    }
  </script>
</body>
</html>

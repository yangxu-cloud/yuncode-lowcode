spring:
  # Redis 配置（使用嵌入式或本地 Redis）
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

# 日志配置
logging:
  level:
    com.yuncode.system: DEBUG
    org.springframework.data.redis: DEBUG

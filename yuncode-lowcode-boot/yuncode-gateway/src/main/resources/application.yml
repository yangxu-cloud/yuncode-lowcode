server:
  port: 9000

spring:
  main:
    web-application-type: reactive
  application:
    name: yuncode-gateway
  profiles:
    active: dev
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.jdbc.DataSourceHealthContributorAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

  cloud:
    gateway:
      # 全局跨域配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${GATEWAY_CORS_ORIGINS:http://localhost:3000,http://localhost:8848}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      # 路由配置
      routes:
        - id: yuncode-admin
          uri: ${gateway.backend.admin-url:http://localhost:8080}
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=0

    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

# Nacos 配置开关
nacos:
  discovery:
    enabled: false
    server-addr: localhost:8848
    namespace: public
    group: YUNCODE_GROUP

# 网关自定义配置
gateway:
  backend:
    admin-url: http://localhost:8080

  # IP 黑白名单（逗号分隔，支持 CIDR 格式，如 192.168.1.0/24）
  # ip-whitelist: 192.168.1.0/24,10.0.0.1
  # ip-blacklist: 1.2.3.4
  ip-whitelist: ""
  ip-blacklist: ""

  # 流量控制
  rate-limit:
    enabled: false
    default-permit: 100
    burst-capacity: 200

  # 慢请求阈值（毫秒）
  slow-request-threshold: 5000

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

# 日志配置
logging:
  level:
    com.yuncode: debug
    org.springframework.cloud.gateway: debug
    org.springframework.web.reactive: debug

# JWT 密钥（必须通过环境变量设置）
sa-token:
  jwt-secret-key: ${JWT_SECRET_KEY}

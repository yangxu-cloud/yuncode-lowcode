# 开发环境 JWT 密钥（仅用于本地开发，生产环境必须通过环境变量设置）
sa-token:
  jwt-secret-key: dev-yuncode-local-development-key-do-not-use-in-production

spring:
  datasource:
    # 开发环境：本地 MySQL，root/root
    url: jdbc:mysql://localhost:3306/yuncode_lowcode?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

knife4j:
  production: false

logging:
  level:
    com.yuncode: debug
    org.springframework: info

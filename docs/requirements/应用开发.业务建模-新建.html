<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, initial-scale=1.0">
    <title>操作指导 | 新建资源</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f0f4f8 0%, #e2e8f0 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 48px 24px;
            min-height: 100vh;
        }

        /* 主卡片容器 */
        .guide-container {
            max-width: 1280px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(0px);
            border-radius: 32px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.2), 0 1px 2px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        /* 头部区域 */
        .guide-header {
            padding: 32px 36px 24px 36px;
            border-bottom: 1px solid #edf2f7;
        }

        .title-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .title-icon {
            font-size: 32px;
            background: linear-gradient(145deg, #3b82f6, #6366f1);
            border-radius: 20px;
            padding: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 12px -6px rgba(59,130,246,0.3);
        }

        .guide-title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #1e293b 0%, #2d3a4f 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .guide-sub {
            font-size: 15px;
            color: #5b6e8c;
            margin-left: 4px;
            letter-spacing: 0.2px;
        }

        /* 卡片网格布局 */
        .cards-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            padding: 36px;
            justify-content: center;
        }

        /* 单个卡片 */
        .action-card {
            flex: 1;
            min-width: 210px;
            max-width: 240px;
            background: #ffffff;
            border-radius: 28px;
            border: 1px solid #e9edf2;
            padding: 24px 20px 28px 20px;
            transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
            text-align: center;
            box-shadow: 0 6px 12px -8px rgba(0, 0, 0, 0.05);
            cursor: default;
        }

        .action-card:hover {
            transform: translateY(-6px);
            border-color: #3b82f6;
            box-shadow: 0 24px 36px -14px rgba(59, 130, 246, 0.25);
        }

        /* 图标圆形容器 */
        .card-icon {
            width: 64px;
            height: 64px;
            background: #eff6ff;
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px auto;
            font-size: 32px;
            transition: all 0.2s;
        }

        .action-card:hover .card-icon {
            background: #3b82f6;
            transform: scale(1.02);
        }

        .action-card:hover .card-icon span {
            filter: brightness(0) invert(1);
        }

        /* 卡片标题 */
        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 12px;
            letter-spacing: -0.2px;
        }

        /* 描述文字 */
        .card-desc {
            font-size: 13px;
            line-height: 1.5;
            color: #5c6f87;
            margin-bottom: 24px;
            min-height: 60px;
            padding: 0 4px;
        }

        /* 线框按钮 */
        .btn-outline {
            display: inline-block;
            width: 100%;
            padding: 10px 0;
            background: transparent;
            border: 1.5px solid #cbd5e1;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            color: #1f3a6b;
            text-decoration: none;
            transition: all 0.25s;
            cursor: pointer;
            text-align: center;
        }

        .btn-outline:hover {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
            box-shadow: 0 4px 10px -4px #3b82f6;
        }

        /* 响应式 */
        @media (max-width: 1100px) {
            .action-card {
                min-width: 200px;
                max-width: 220px;
            }
        }

        @media (max-width: 780px) {
            .cards-grid {
                gap: 20px;
            }
            .action-card {
                min-width: 160px;
            }
            .guide-header {
                padding: 24px 24px 20px;
            }
            .guide-title {
                font-size: 24px;
            }
        }

        @media (max-width: 620px) {
            .cards-grid {
                padding: 24px;
            }
            .action-card {
                min-width: 100%;
                max-width: 280px;
            }
        }

        /* 轻量动画 */
        .action-card {
            animation: fadeUp 0.4s ease backwards;
        }
        .action-card:nth-child(1) { animation-delay: 0.05s; }
        .action-card:nth-child(2) { animation-delay: 0.1s; }
        .action-card:nth-child(3) { animation-delay: 0.15s; }
        .action-card:nth-child(4) { animation-delay: 0.2s; }
        .action-card:nth-child(5) { animation-delay: 0.25s; }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
<div class="guide-container">
    <div class="guide-header">
        <div class="title-wrapper">
            <div class="title-icon">📘</div>
            <div class="guide-title">操作指导</div>
        </div>
        <div class="guide-sub">选择您需要创建的资源类型，快速开启业务搭建</div>
    </div>
    <div class="cards-grid">
        <!-- 卡片1：新建业务数据库 -->
        <div class="action-card">
            <div class="card-icon"><span>🗄️</span></div>
            <div class="card-title">新建业务数据库</div>
            <div class="card-desc">创建数据表，定义字段类型与索引，支撑业务持久化存储。</div>
            <a href="#" class="btn-outline">立即新建 →</a>
        </div>
        <!-- 卡片2：新建业务表单 -->
        <div class="action-card">
            <div class="card-icon"><span>📋</span></div>
            <div class="card-title">新建业务表单</div>
            <div class="card-desc">设计可视化表单，配置校验规则与布局，快速收集数据。</div>
            <a href="#" class="btn-outline">立即新建 →</a>
        </div>
        <!-- 卡片3：新建业务流程 -->
        <div class="action-card">
            <div class="card-icon"><span>🔄</span></div>
            <div class="card-title">新建业务流程</div>
            <div class="card-desc">定义审批节点，设置流转条件，实现自动化业务流转。</div>
            <a href="#" class="btn-outline">立即新建 →</a>
        </div>
        <!-- 卡片4：新建台账管理 -->
        <div class="action-card">
            <div class="card-icon"><span>📊</span></div>
            <div class="card-title">新建台账管理</div>
            <div class="card-desc">建立业务台账，跟踪数据变更，汇总关键指标。</div>
            <a href="#" class="btn-outline">立即新建 →</a>
        </div>
        <!-- 卡片5：新建关联字典 -->
        <div class="action-card">
            <div class="card-icon"><span>📖</span></div>
            <div class="card-title">新建关联字典</div>
            <div class="card-desc">维护代码映射，统一数据标准，提升系统一致性。</div>
            <a href="#" class="btn-outline">立即新建 →</a>
        </div>
    </div>
</div>
</body>
</html>
